# Deployment only: no source builds, public application ports or database migrations.
name: forever-hotel-full
services:
  mad-backend:
    image: ghcr.io/forever-hotel/manager-dashboard/backend:unconfigured
    env_file:
    - ./env/mad-backend.env
    environment:
      NODE_ENV: production
      PORT: '4000'
      HOSTNAME: 0.0.0.0
      DB_SYNCHRONIZE: 'false'
      DB_SSL: 'true'
    restart: unless-stopped
    init: true
    networks:
    - application
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4000/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      start_period: 90s
      interval: 10s
      timeout: 8s
      retries: 6
  websocket:
    image: ghcr.io/forever-hotel/websocket-service:unconfigured
    env_file:
    - ./env/websocket.env
    environment:
      NODE_ENV: production
      PORT: '8081'
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    init: true
    networks:
    - application
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8081/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
