    environment:
      NODE_ENV: production
      PORT: '8080'
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    init: true
    networks:
      application: null
      edge:
        aliases:
        - forever-gateway
        - shared-gateway
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8080/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
