  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Set a reviewed digest-pinned RabbitMQ image in host .env}
    env_file:
    - ./env/rabbitmq.env
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
    - application
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      start_period: 90s
      interval: 20s
      timeout: 30s
      retries: 6
networks:
  application: {}
  edge:
    external: true
    name: ${EDGE_NETWORK:?Set the existing approved Caddy network in host .env}
volumes:
  rabbitmq-data: {}
