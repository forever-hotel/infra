      "image": "rabbitmq:4-management",
      "env_file": [
        "./env/rabbitmq.env"
      ],
      "volumes": [
        "rabbitmq_data:/var/lib/rabbitmq"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "30s"
      }
    }
